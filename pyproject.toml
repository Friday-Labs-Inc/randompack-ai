[project]
name = "randompack_ai"
authors = [{ name = "Friday Labs", email = "hello@fridaylabs.in" }]
description = "The design-studio domain for Friday — pipelines, personas and client seams as data, on the Friday agent kernel."
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
# --- Friday Labs house lint/format config (Engineering Standard §3) ----------
# Appended to pyproject.toml by apply.sh when no [tool.ruff] block exists.
# Derived from the Frappe framework's own config so that a diff against the
# framework stays readable: tabs, 110 columns, and the ignores that exist
# because Frappe's runtime injects names ruff cannot see.
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = [
	"F",
	"E",
	"W",
	"I",
	"UP",
	"B",
	"RUF",
]
ignore = [
	"B017", # assertRaises(Exception) - should be more specific
	"B018", # useless expression, not assigned to anything
	"B023", # function doesn't bind loop variable - will have last iteration's value
	"B904", # raise inside except without from
	"E101", # indentation contains mixed spaces and tabs
	"E402", # module level import not at top of file
	"E501", # line too long
	"E741", # ambiguous variable name
	"F401", # "unused" imports
	"F403", # can't detect undefined names from * import
	"F405", # can't detect undefined names from * import
	"F722", # syntax error in forward type annotation
	"W191", # indentation contains tabs
	"UP030", # Use implicit references for positional format fields (translations)
	"UP031", # Use format specifiers instead of percent format
	"UP032", # Use f-string instead of `format` call (translations)
	"UP037", # quoted annotations
	"UP040", # Use type aliases instead of type annotations
	"RUF002", # ambiguous unicode in docstrings — we write en dashes on purpose
	"RUF012", # mutable class attribute — the idiom of Frappe DocTypes and unittest fixtures
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
