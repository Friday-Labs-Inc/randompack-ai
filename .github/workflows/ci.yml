# Friday Labs house CI — one workflow, every repo.
# Source of truth: the Engineering Standard, §5 (CI pipeline).
#
# Two rules make this one file work across a Frappe app, an ops shell repo and a
# React frontend without per-repo knobs:
#
#   1. `detect` reads the repo's own manifests and switches jobs on. Nothing to
#      configure; add a `package.json` and the node jobs start running.
#   2. `required` is the ONLY job named in branch protection. It aggregates every
#      other job, so the required-check name is identical in all 25 repos even
#      though the job set differs. Skipped jobs pass; failed jobs fail.
#
# Cheapest first, fail early: hygiene (~20s) -> lint (~1m) -> unit (~3m) ->
# bench integration (~25m). Target PR wall-clock budget: 10 min without a bench,
# 30 min with one.
name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- stage 0
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional commit subjects on this branch
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            case "$subject" in
              Merge\ *|Revert\ *) continue ;;
            esac
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::not a conventional commit subject: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          [ "$bad" -eq 0 ] || {
            echo "Standard §3: subjects must be <type>(<scope>): <summary>." >&2
            exit 1
          }

      - name: No credential-shaped file is tracked
        run: |
          set -euo pipefail
          # Tracked files only: an untracked local .env is the developer's
          # business, a committed one is an incident (Standard §8).
          if git ls-files -z \
               '*.env' '.env' '.env.*' '*.pem' '*.key' '*.p12' '*.pfx' \
               '*.keystore' 'id_rsa*' '*service-account*.json' \
             | grep -zv '\.example$' \
             | grep -zv '\.sample$' \
             | grep -zv '\.template$' \
             | tr '\0' '\n' | grep . ; then
            echo "::error::credential-shaped file is tracked in git (Standard §8)"
            exit 1
          fi
          echo "no tracked credential-shaped files"

      - name: Exactly one lockfile per install root
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          LOCKS = ("yarn.lock", "package-lock.json", "pnpm-lock.yaml", "bun.lockb")

          tracked = subprocess.run(
              ["git", "ls-files", "-z", "*package.json", ":!:**/node_modules/**"],
              capture_output=True, text=True, check=True,
          ).stdout.split("\0")

          # A Frappe DocType definition can legitimately be called package.json
          # (bookpondy_pms/.../doctype/package/package.json). Only a real npm
          # manifest counts: it has a name and something npm would act on.
          def is_npm_manifest(path):
              try:
                  data = json.loads(open(path, encoding="utf-8").read())
              except (OSError, ValueError):
                  return False
              if not isinstance(data, dict) or "name" not in data:
                  return False
              keys = {"scripts", "dependencies", "devDependencies", "workspaces",
                      "peerDependencies", "private", "version"}
              return bool(keys & data.keys())

          manifests = [p for p in tracked if p and is_npm_manifest(p)]

          # A workspace member does not carry its own lockfile; the root does.
          roots = set()
          for path in manifests:
              try:
                  data = json.loads(open(path, encoding="utf-8").read())
              except (OSError, ValueError):
                  continue
              if data.get("workspaces"):
                  roots.add(os.path.dirname(path) or ".")

          def in_workspace(directory):
              cur = directory
              while True:
                  parent = os.path.dirname(cur)
                  if parent == cur:
                      break
                  cur = parent or "."
                  if cur in roots:
                      return True
                  if cur == ".":
                      break
              return "." in roots and directory != "."

          status = 0
          for path in manifests:
              directory = os.path.dirname(path) or "."
              present = [lock for lock in LOCKS
                         if os.path.exists(os.path.join(directory, lock))]
              if len(present) > 1:
                  # Whichever tool the contributor reaches for, the other lock
                  # is silently stale.
                  print(f"::error file={path}::competing lockfiles in {directory}: "
                        f"{' '.join(present)} (Standard §8)")
                  status = 1
              elif not present and not in_workspace(directory):
                  print(f"::error file={path}::{directory} is an install root with "
                        f"no lockfile (Standard §8)")
                  status = 1
              else:
                  print(f"ok  {directory}: {' '.join(present) or 'workspace member'}")

          if not manifests:
              print("no npm manifests in this repository")
          sys.exit(status)
          PY

      - name: Required repo documents exist
        run: |
          set -euo pipefail
          status=0
          for f in README.md CONTRIBUTING.md .editorconfig \
                   .github/pull_request_template.md .github/CODEOWNERS; do
            [ -f "$f" ] || { echo "::error::missing $f (Standard §1)"; status=1; }
          done
          exit $status

  # ---------------------------------------------------------------- detect
  detect:
    name: Detect toolchains
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.d.outputs.python }}
      node: ${{ steps.d.outputs.node }}
      shell: ${{ steps.d.outputs.shell }}
      bench: ${{ steps.d.outputs.bench }}
      frappe_branch: ${{ steps.d.outputs.frappe_branch }}
      app: ${{ steps.d.outputs.app }}
      node_version: ${{ steps.d.outputs.node_version }}
      pkg: ${{ steps.d.outputs.pkg }}
    steps:
      - uses: actions/checkout@v4

      - id: d
        name: Read the manifests
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }

          [ -f pyproject.toml ] && out python true || out python false
          [ -n "$(git ls-files '*package.json' ':!:**/node_modules/**')" ] \
            && out node true || out node false
          [ -n "$(git ls-files '*.sh')" ] && out shell true || out shell false

          # A Frappe app is hooks.py + modules.txt. Its framework major is read
          # from pyproject, never hard-coded here (Standard §5, §7).
          app=""
          hooks=$(git ls-files '*/hooks.py' | head -1 || true)
          if [ -n "$hooks" ] && [ -f "$(dirname "$hooks")/modules.txt" ]; then
            app=$(basename "$(dirname "$hooks")")
          fi
          out app "$app"

          branch=""
          if [ -n "$app" ] && [ -f pyproject.toml ]; then
            # Read the declared major out of [tool.bench.frappe-dependencies].
            # An undeclared version is not guessed: bench stays false and the
            # repo carries an exemption (Standard §7, §10).
            branch=$(sed -n \
              '/^\[tool\.bench\.frappe-dependencies\]/,/^\[[^t]/ {
                 s/^frappe[[:space:]]*=[[:space:]]*"[^0-9]*\([0-9][0-9]*\)\..*/version-\1/p
               }' pyproject.toml | head -1)
          fi
          out frappe_branch "$branch"
          if [ -n "$app" ] && [ -n "$branch" ]; then out bench true; else out bench false; fi

          # Node major: mise.toml, then .nvmrc, then the house default.
          nv=""
          if [ -f mise.toml ]; then
            nv=$(sed -n 's/^ *node *= *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' mise.toml | head -1)
          fi
          [ -z "$nv" ] && [ -f .nvmrc ] && nv=$(tr -d 'v \n' < .nvmrc)
          [ -z "$nv" ] && nv=24
          out node_version "$nv"

          pkg=npm
          [ -f yarn.lock ] && pkg=yarn
          [ -f pnpm-lock.yaml ] && pkg=pnpm
          out pkg "$pkg"

  # ---------------------------------------------------------------- stage 1
  lint-python:
    name: Lint (python)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pinned: a floating linter version turns an unrelated PR red.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.8"
          args: check --output-format=github
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.8"
          args: format --check

  lint-shell:
    name: Lint (shell)
    needs: detect
    if: needs.detect.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # Tracked shell scripts only; vendored copies are excluded by
          # .shellcheckrc-style path filters in the repo, not here.
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty \
            shellcheck --severity=warning --external-sources

  lint-node:
    name: Lint and test (node)
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.detect.outputs.node_version }}
          cache: ${{ needs.detect.outputs.pkg }}
      - name: Install from the lockfile
        run: |
          set -euo pipefail
          case "${{ needs.detect.outputs.pkg }}" in
            yarn) yarn install --frozen-lockfile ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            npm)  npm ci ;;
          esac
      - name: Test
        run: |
          set -euo pipefail
          # `--if-present` keeps the job honest: a repo with no test script
          # fails the Standard §6 reviewer check, not this step.
          npm run --if-present test
      - name: Build
        run: npm run --if-present build

  # ---------------------------------------------------------------- stage 2
  test-python:
    name: Tests (bench)
    needs: detect
    if: needs.detect.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP: ${{ needs.detect.outputs.app }}
      SITE: test_site
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          path: app-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.detect.outputs.node_version }}

      - name: Init bench on ${{ needs.detect.outputs.frappe_branch }}
        run: |
          set -euo pipefail
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets \
            --python "$(which python)" \
            --frappe-branch "${{ needs.detect.outputs.frappe_branch }}" \
            frappe-bench
          cd frappe-bench
          bench get-app --branch "${{ needs.detect.outputs.frappe_branch }}" erpnext
          mv ../app-src "apps/${APP}"
          ./env/bin/pip install -e "apps/${APP}"
          grep -qxF "${APP}" sites/apps.txt || echo "${APP}" >> sites/apps.txt

      - name: New site and install the app
        working-directory: frappe-bench
        run: |
          set -euo pipefail
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache "redis://127.0.0.1:6379"
          bench set-config -g redis_queue "redis://127.0.0.1:6379"
          bench set-config -g redis_socketio "redis://127.0.0.1:6379"
          bench new-site "${SITE}" \
            --db-root-username root --db-root-password root --admin-password admin
          bench --site "${SITE}" install-app erpnext
          # install-app IS the smoke test: it runs every patch and validates
          # every DocType this app ships.
          bench --site "${SITE}" install-app "${APP}"

      - name: Run tests
        working-directory: frappe-bench
        run: |
          set -euo pipefail
          bench --site "${SITE}" set-config allow_tests true
          bench --site "${SITE}" run-tests --app "${APP}" --coverage

  # ---------------------------------------------------------------- the gate
  required:
    # THE one required check. Branch protection names this job and nothing else,
    # so the same protection rule applies to a Frappe app, an ops repo and a
    # React app. Do not rename it (Standard §4).
    name: required
    if: always()
    needs: [hygiene, detect, lint-python, lint-shell, lint-node, test-python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          # 'skipped' is a pass: the toolchain is not present in this repo.
          if printf '%s' "$RESULTS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "::error::a required CI job failed"
            exit 1
          fi
          echo "all applicable checks green"
